name: CI

on:
  workflow_dispatch:
    inputs:
      build-all:
        description: Build native dependencies from source instead of downloading prebuilt native wheels.
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
    paths:
      - 'chipcompiler/**'
      - 'agent/**'
      - 'test/**'
      - 'scripts/**'
      - 'docs/examples/**'
      - 'ecc.spec'
      - 'packaging/**'
      - 'hooks/**'
      - 'pyproject.toml'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/revision.toml'
      - '.github/scripts/**'
      - 'deploy/arc-cache/**'
      - 'nix/**'
  # Nightly on main: same pipeline, e2e matrix additionally covers the big
  # designs (see e2e-designs).
  schedule:
    - cron: "17 18 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  check-version:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version
        uses: ./.github/actions/check-version
        with:
          expected_ref: ${{ startsWith(github.ref, 'refs/heads/release/v') && github.ref || startsWith(github.base_ref, 'release/v') && github.base_ref || '' }}

  list-versions:
    name: List dependency versions
    runs-on: ubuntu-latest
    outputs:
      oss_cad_suite_version: ${{ steps.resolve.outputs.oss_cad_suite_version }}
      oss_cad_suite_sha256: ${{ steps.resolve.outputs.oss_cad_suite_sha256 }}
      sizer_repo: ${{ steps.resolve.outputs.sizer_repo }}
      sizer_workflow: ${{ steps.resolve.outputs.sizer_workflow }}
      sizer_run_id: ${{ steps.resolve.outputs.sizer_run_id }}
      sizer_git_commit: ${{ steps.resolve.outputs.sizer_git_commit }}
      sizer_artifact: ${{ steps.resolve.outputs.sizer_artifact }}
      sizer_archive: ${{ steps.resolve.outputs.sizer_archive }}
      sizer_root_marker: ${{ steps.resolve.outputs.sizer_root_marker }}
      sizer_sha256: ${{ steps.resolve.outputs.sizer_sha256 }}
      kepler_formal_repo: ${{ steps.resolve.outputs.kepler_formal_repo }}
      kepler_formal_workflow: ${{ steps.resolve.outputs.kepler_formal_workflow }}
      kepler_formal_version: ${{ steps.resolve.outputs.kepler_formal_version }}
      kepler_formal_run_id: ${{ steps.resolve.outputs.kepler_formal_run_id }}
      kepler_formal_git_commit: ${{ steps.resolve.outputs.kepler_formal_git_commit }}
      kepler_formal_artifact: ${{ steps.resolve.outputs.kepler_formal_artifact }}
      kepler_formal_archive: ${{ steps.resolve.outputs.kepler_formal_archive }}
      kepler_formal_root_marker: ${{ steps.resolve.outputs.kepler_formal_root_marker }}
      kepler_formal_sha256: ${{ steps.resolve.outputs.kepler_formal_sha256 }}
      pdk_repo: ${{ steps.resolve.outputs.pdk_repo }}
      pdk_release: ${{ steps.resolve.outputs.pdk_release }}
      pdk_git_commit: ${{ steps.resolve.outputs.pdk_git_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List revision.toml
        id: resolve
        run: |
          set -euo pipefail
          nix run .#list-versions -- --format github | tee -a "$GITHUB_OUTPUT"

      - name: Upload CI actions
        uses: actions/upload-artifact@v4
        with:
          name: ecc-ci-actions
          path: .github/actions
          if-no-files-found: error
          retention-days: 1

  prepare-test-tools:
    name: Prepare test tools
    needs: list-versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite-cached
        with:
          version: ${{ needs.list-versions.outputs.oss_cad_suite_version }}
          sha256: ${{ needs.list-versions.outputs.oss_cad_suite_sha256 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup kepler-formal
        uses: ./.github/actions/install-ci-tool
        with:
          repo: ${{ needs.list-versions.outputs.kepler_formal_repo }}
          workflow: ${{ needs.list-versions.outputs.kepler_formal_workflow }}
          run-id: ${{ needs.list-versions.outputs.kepler_formal_run_id }}
          head-sha: ${{ needs.list-versions.outputs.kepler_formal_git_commit }}
          cache-key: kepler-formal-${{ needs.list-versions.outputs.kepler_formal_run_id }}-${{ needs.list-versions.outputs.kepler_formal_sha256 }}
          sha256: ${{ needs.list-versions.outputs.kepler_formal_sha256 }}
          artifact: ${{ needs.list-versions.outputs.kepler_formal_artifact }}
          archive: ${{ needs.list-versions.outputs.kepler_formal_archive }}
          root-marker: ${{ needs.list-versions.outputs.kepler_formal_root_marker }}
          root-env: CHIPCOMPILER_KEPLER_FORMAL_ROOT
          github-token: ${{ github.token }}

      - name: Verify kepler-formal
        run: |
          "${CHIPCOMPILER_KEPLER_FORMAL_ROOT}/bin/kepler-formal" --version

  test:
    name: Test
    needs: [check-version, list-versions, prepare-test-tools, pdk, sizer]
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          build-all: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['build-all'] == 'true' && 'true' || 'false' }}

      - name: Setup PDK
        uses: actions/download-artifact@v4
        with:
          name: icsprout55-pdk
          path: ../pdk

      - name: Extract PDK
        run: |
          mkdir -p ../pdk/icsprout55-pdk
          tar -xzf ../pdk/icsprout55-pdk.tar.gz -C ../pdk/icsprout55-pdk
          test -s ../pdk/icsprout55-pdk/techfile/icsprout55.layermap

      - name: Setup OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite-cached
        with:
          version: ${{ needs.list-versions.outputs.oss_cad_suite_version }}
          sha256: ${{ needs.list-versions.outputs.oss_cad_suite_sha256 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Sizer
        uses: actions/download-artifact@v4
        with:
          name: ecc-sizer

      - name: Extract Sizer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ecc-sizer"
          tar -xzf ecc-sizer.tar.gz -C "$RUNNER_TEMP/ecc-sizer"
          echo "$RUNNER_TEMP/ecc-sizer/bin" >> "$GITHUB_PATH"
          echo "CHIPCOMPILER_ECC_SIZER_ROOT=$RUNNER_TEMP/ecc-sizer" >> "$GITHUB_ENV"

      - name: Verify Sizer
        shell: bash
        run: |
          sizer_path="$(command -v Sizer)"
          test "$(readlink -f "$sizer_path")" = "$(readlink -f "$CHIPCOMPILER_ECC_SIZER_ROOT/bin/Sizer")"
          test -f "${CHIPCOMPILER_ECC_SIZER_ROOT}/src/sizer_os.tcl"
          test -x "${CHIPCOMPILER_ECC_SIZER_ROOT}/libexec/Sizer"

      - name: Setup kepler-formal
        id: install
        uses: ./.github/actions/install-ci-tool
        with:
          repo: ${{ needs.list-versions.outputs.kepler_formal_repo }}
          workflow: ${{ needs.list-versions.outputs.kepler_formal_workflow }}
          run-id: ${{ needs.list-versions.outputs.kepler_formal_run_id }}
          head-sha: ${{ needs.list-versions.outputs.kepler_formal_git_commit }}
          cache-key: kepler-formal-${{ needs.list-versions.outputs.kepler_formal_run_id }}-${{ needs.list-versions.outputs.kepler_formal_sha256 }}
          sha256: ${{ needs.list-versions.outputs.kepler_formal_sha256 }}
          artifact: ${{ needs.list-versions.outputs.kepler_formal_artifact }}
          archive: ${{ needs.list-versions.outputs.kepler_formal_archive }}
          root-marker: ${{ needs.list-versions.outputs.kepler_formal_root_marker }}
          root-env: CHIPCOMPILER_KEPLER_FORMAL_ROOT
          github-token: ${{ github.token }}

      - name: Verify kepler-formal
        run: |
          test '${{ steps.install.outputs.head-sha }}' = '${{ needs.list-versions.outputs.kepler_formal_git_commit }}'
          command -v kepler-formal
          "${CHIPCOMPILER_KEPLER_FORMAL_ROOT}/bin/kepler-formal" --version

      - name: Pytest
        run: uv run --no-sync pytest test/ -v --basetemp=pytest-tmp --cov=chipcompiler --cov-report=

      - name: Pytest (agent)
        run: uv run --no-sync pytest agent/test -v --basetemp=pytest-agent-tmp

      - name: Prune test fixture symlinks before log upload
        if: failure()
        run: find pytest-tmp -type l -delete

      - name: Upload integration flow logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-flow-logs
          if-no-files-found: ignore
          path: |
            pytest-tmp/**/home/flow.json
            pytest-tmp/**/log/**
            pytest-tmp/**/data/**/*.log

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '## Coverage Report'
            echo '```'
            uv run --no-sync coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-pyinstaller:
    name: Build PyInstaller Bundle
    needs: check-version
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          build-all: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['build-all'] == 'true' && 'true' || 'false' }}

      - name: Smoke test native toolchain wheels
        run: |
          .venv/bin/python - <<'PY'
          import ecc_tools_bin.ecc_py  # noqa: F401
          from chipcompiler.tools.ecc.module import ECCToolsModule
          from dreamplace.Params import Params  # noqa: F401
          from dreamplace.Placer import PlacementEngine  # noqa: F401

          assert ECCToolsModule().get_ecc() is not None
          print("ecc-tools wrapper and ecc-dreamplace imports passed")
          PY

      - name: Build PyInstaller bundle
        uses: ./.github/actions/build-pyinstaller-bundle
        with:
          artifact-path: dist/ecc.tar
          artifact-format: tar

      - name: Upload PyInstaller artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecc-cli-linux-x86_64
          if-no-files-found: ignore
          path: |
            dist/ecc.tar

  pdk:
    name: Fetch PDK
    needs: list-versions
    runs-on: ubuntu-latest
    env:
      PDK_REPO: ${{ needs.list-versions.outputs.pdk_repo }}
      PDK_RELEASE: ${{ needs.list-versions.outputs.pdk_release }}
      PDK_GIT_COMMIT: ${{ needs.list-versions.outputs.pdk_git_commit }}
    outputs:
      revision: ${{ steps.checkout.outputs.revision }}
      release: ${{ steps.unpack.outputs.release }}
    steps:
      - name: Checkout PDK
        id: checkout
        run: |
          git init pdk
          git -C pdk remote add origin "https://github.com/${PDK_REPO}.git"
          git -C pdk fetch --depth 1 origin "$PDK_GIT_COMMIT"
          git -C pdk checkout --detach FETCH_HEAD
          test "$(git -C pdk rev-parse HEAD)" = "$PDK_GIT_COMMIT"
          echo "revision=$PDK_GIT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Unpack PDK
        id: unpack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pdk
          gh release download "$PDK_RELEASE" --repo "$PDK_REPO" --pattern '*.tar.bz2'
          make unzip
          echo "release=$PDK_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Package PDK
        run: tar -czf icsprout55-pdk.tar.gz -C pdk .

      - name: Upload PDK
        uses: actions/upload-artifact@v4
        with:
          name: icsprout55-pdk
          path: icsprout55-pdk.tar.gz

  sizer:
    name: Fetch Sizer
    needs: list-versions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIZER_REPO: ${{ needs.list-versions.outputs.sizer_repo }}
      SIZER_RUN_ID: ${{ needs.list-versions.outputs.sizer_run_id }}
      SIZER_GIT_COMMIT: ${{ needs.list-versions.outputs.sizer_git_commit }}
      SIZER_ARTIFACT: ${{ needs.list-versions.outputs.sizer_artifact }}
      SIZER_ARCHIVE: ${{ needs.list-versions.outputs.sizer_archive }}
      SIZER_SHA256: ${{ needs.list-versions.outputs.sizer_sha256 }}
    outputs:
      run-id: ${{ steps.download.outputs.run-id }}
    steps:
      - name: Download ecc-sizer CI artifact
        id: download
        shell: bash
        run: |
          set -euo pipefail

          run_id="$SIZER_RUN_ID"
          head_sha="$(gh api "repos/${SIZER_REPO}/actions/runs/${run_id}" --jq '.head_sha')"
          test "$head_sha" = "$SIZER_GIT_COMMIT"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

          install_root="${RUNNER_TEMP}/ecc-sizer-${run_id}"
          mkdir -p "$install_root"
          echo "Downloading ecc-sizer ${SIZER_GIT_COMMIT} from CI run ${run_id}"
          gh run download "$run_id" \
            --repo "$SIZER_REPO" \
            --name "$SIZER_ARTIFACT" \
            --dir "$install_root"

          archive="$(find "$install_root" -name "$SIZER_ARCHIVE" -print -quit)"
          if [ -z "$archive" ]; then
            echo "::error::${SIZER_ARCHIVE} was not in the downloaded artifact"
            exit 1
          fi
          printf '%s  %s\n' "$SIZER_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$install_root"

          mapfile -t sizer_roots < <(
            find "$install_root" -type f -path '*/src/sizer_os.tcl' -printf '%h\n' |
              sed 's#/src$##' | sort -u
          )
          if [ "${#sizer_roots[@]}" -ne 1 ]; then
            echo "::error::Expected one ecc-sizer runtime root, found ${#sizer_roots[@]}"
            printf '  %s\n' "${sizer_roots[@]}"
            exit 1
          fi
          sizer_root="${sizer_roots[0]}"
          if [ ! -x "${sizer_root}/bin/Sizer" ]; then
            echo "::error::Downloaded ecc-sizer artifact is missing bin/Sizer or src/sizer_os.tcl"
            exit 1
          fi
          tar -czf ecc-sizer.tar.gz -C "$sizer_root" .

      - name: Upload Sizer
        uses: actions/upload-artifact@v4
        with:
          name: ecc-sizer
          path: ecc-sizer.tar.gz

  e2e-designs:
    name: List e2e designs
    runs-on: ubuntu-latest
    outputs:
      designs: ${{ steps.list.outputs.designs }}
    steps:
      - name: Checkout designs
        uses: actions/checkout@v4
        with:
          repository: openecos-projects/ecc-ci-designs
          path: designs

      - name: List designs
        id: list
        run: |
          # xtea disabled everywhere for now: real run shows hold WNS < 0,
          # which would keep its strict signoff gates red until tuned.
          excludes=(xtea)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            excludes+=(aes BM64)
          fi
          designs="$(find designs -mindepth 2 -maxdepth 2 -name ecc.toml -printf '%h\n' \
            | xargs -n1 basename | grep -vxFf <(printf '%s\n' "${excludes[@]}") \
            | jq -R . | jq -cs .)"
          echo "designs=$designs" >> "$GITHUB_OUTPUT"

  e2e-packaged-flow:
    name: E2E Packaged Flow (${{ matrix.design }})
    needs: [build-pyinstaller, e2e-designs, pdk, sizer, list-versions]
    strategy:
      fail-fast: false
      matrix:
        design: ${{ fromJSON(needs.e2e-designs.outputs.designs) }}
    # Bare ubuntu-latest (not the manylinux container): also proves the
    # manylinux-built bundle runs on a current distro.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout designs
        uses: actions/checkout@v4
        with:
          repository: openecos-projects/ecc-ci-designs
          path: designs

      - name: Download PyInstaller artifact
        uses: actions/download-artifact@v4
        with:
          name: ecc-cli-linux-x86_64

      - name: Extract PyInstaller bundle
        run: |
          mkdir -p dist/ecc-bundle
          tar -xf ecc.tar -C dist/ecc-bundle
          test -x dist/ecc-bundle/ecc

      - name: Setup PDK
        uses: actions/download-artifact@v4
        with:
          name: icsprout55-pdk
          path: ../pdk

      - name: Extract PDK
        run: |
          mkdir -p ../pdk/icsprout55-pdk
          tar -xzf ../pdk/icsprout55-pdk.tar.gz -C ../pdk/icsprout55-pdk
          test -s ../pdk/icsprout55-pdk/techfile/icsprout55.layermap

      - name: Setup OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite-cached
        with:
          version: ${{ needs.list-versions.outputs.oss_cad_suite_version }}
          sha256: ${{ needs.list-versions.outputs.oss_cad_suite_sha256 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Sizer
        uses: actions/download-artifact@v4
        with:
          name: ecc-sizer

      - name: Extract Sizer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ecc-sizer"
          tar -xzf ecc-sizer.tar.gz -C "$RUNNER_TEMP/ecc-sizer"
          echo "$RUNNER_TEMP/ecc-sizer/bin" >> "$GITHUB_PATH"
          echo "CHIPCOMPILER_ECC_SIZER_ROOT=$RUNNER_TEMP/ecc-sizer" >> "$GITHUB_ENV"

      - name: Verify Sizer
        shell: bash
        run: |
          sizer_path="$(command -v Sizer)"
          test "$(readlink -f "$sizer_path")" = "$(readlink -f "$CHIPCOMPILER_ECC_SIZER_ROOT/bin/Sizer")"
          test -f "${CHIPCOMPILER_ECC_SIZER_ROOT}/src/sizer_os.tcl"
          test -x "${CHIPCOMPILER_ECC_SIZER_ROOT}/libexec/Sizer"

      - name: Setup kepler-formal
        id: install
        uses: ./.github/actions/install-ci-tool
        with:
          repo: ${{ needs.list-versions.outputs.kepler_formal_repo }}
          workflow: ${{ needs.list-versions.outputs.kepler_formal_workflow }}
          run-id: ${{ needs.list-versions.outputs.kepler_formal_run_id }}
          head-sha: ${{ needs.list-versions.outputs.kepler_formal_git_commit }}
          cache-key: kepler-formal-${{ needs.list-versions.outputs.kepler_formal_run_id }}-${{ needs.list-versions.outputs.kepler_formal_sha256 }}
          sha256: ${{ needs.list-versions.outputs.kepler_formal_sha256 }}
          artifact: ${{ needs.list-versions.outputs.kepler_formal_artifact }}
          archive: ${{ needs.list-versions.outputs.kepler_formal_archive }}
          root-marker: ${{ needs.list-versions.outputs.kepler_formal_root_marker }}
          root-env: CHIPCOMPILER_KEPLER_FORMAL_ROOT
          github-token: ${{ github.token }}

      - name: Verify kepler-formal
        run: |
          test '${{ steps.install.outputs.head-sha }}' = '${{ needs.list-versions.outputs.kepler_formal_git_commit }}'
          command -v kepler-formal
          "${CHIPCOMPILER_KEPLER_FORMAL_ROOT}/bin/kepler-formal" --version

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Run design flows
        id: design-flow
        run: |
          emir_params="$(dist/ecc-bundle/ecc param list --step emir --plain \
            --project "designs/${{ matrix.design }}")"
          if [[ -n "$emir_params" ]]; then
            echo "::warning::EMIR uses synthetic process data for flow testing, not signoff."
            dist/ecc-bundle/ecc param set emir.technology_file_path \
              "$PWD/test/fixtures/emir/ics55_synthetic.tech" \
              --project "designs/${{ matrix.design }}"
          fi
          bash nix/scripts/run-designs.sh \
            --ecc "$PWD/dist/ecc-bundle/ecc" \
            --designs-dir designs \
            --design "${{ matrix.design }}" \
            --out-root "$RUNNER_TEMP/e2e"

      - name: Lit check flow artifacts
        run: |
          nixpkgs="github:NixOS/nixpkgs/f4b140d5b253f5e2a1ff4e5506edbf8267724bde"
          ECC_FLOW_WORKSPACES="$RUNNER_TEMP/e2e" nix shell \
            "${nixpkgs}#lit" \
            "${nixpkgs}#llvmPackages_21.libllvm" \
            "${nixpkgs}#jq" \
            -c bash nix/scripts/signoff-lit.sh designs --filter "${{ matrix.design }}"

      - name: Upload e2e workspaces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-flow-workspace-${{ matrix.design }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/e2e

  lint:
    needs: check-version
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Ruff format check
        run: uv run --no-sync ruff format --check chipcompiler test agent

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github chipcompiler test agent

      - name: Basedpyright
        run: |
          uv run --no-sync basedpyright --baselinemode=auto
          git diff --exit-code .basedpyright/baseline.json
          if grep -q reportMissingImports .basedpyright/baseline.json; then
            echo "::error::basedpyright baseline must not contain reportMissingImports"
            exit 1
          fi

      - name: Ty cross-check (non-blocking)
        continue-on-error: true
        run: |
          {
            echo "basedpyright is the gate; ty is a cross-check."
            echo '```'
            .github/scripts/type-check-compare.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  nix-build:
    name: Nix Build (flake checks)
    runs-on: ubuntu-latest
    # Cold cache builds boost, ecc-tools, dreamplace and kepler-formal/naja
    # from source; magic-nix-cache makes subsequent runs incremental.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            extra-substituters = https://cache.ani.llc
            extra-trusted-public-keys = cache.ani.llc:8nINs8lCCU0Yoed1KMjLj6fCHpMmrY+sFuhGTdxLB88=

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build all flake checks
        run: nix flake check -L
